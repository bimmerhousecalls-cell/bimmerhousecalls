<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner dashboard · Bimmer House Calls</title>
<style>
  :root{--ink:#0B0B0D;--mut:#5b6470;--line:#e3e7ec;--accent:#FFD400;--accent-2:#E6BF00;--accent-ink:#0B0B0D;
        --ok:#0a7d43;--warn:#b25e00;--bad:#b42318;--bg:#f5f7fa;--card:#fff;
        --nav-bg:#0B0B0D;--nav-ink:#c9cdd4;--nav-on:#1d1d22}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  a{color:#8a6d00}
  .app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
  nav{background:var(--nav-bg);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh}
  nav .brand{font-weight:800;font-size:15px;letter-spacing:-.01em;margin:0 8px 18px}
  nav .brand span{color:var(--accent)}
  nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--nav-ink);font:inherit;padding:10px 12px;border-radius:9px;cursor:pointer;margin-bottom:2px}
  nav button.on{background:var(--nav-on);color:var(--accent);font-weight:700}
  nav .who{margin:22px 8px 0;font-size:12px;color:#7b8794;line-height:1.4}
  main{padding:22px 24px 60px;max-width:1200px}
  h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
  .muted{color:var(--mut);font-size:13.5px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .kpi .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
  .kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0 0 12px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
  tr.click{cursor:pointer}
  tr.click:hover td{background:#f7f9fc}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:#eef2f6;color:#3b4653;white-space:nowrap}
  .pill.lead,.pill.quoted{background:#fff4e5;color:var(--warn)}
  .pill.sent,.pill.proposal_sent,.pill.viewed{background:#FFF6C2;color:#5a4a00}
  .pill.signed,.pill.confirmed,.pill.deposit_paid{background:#e7f7ee;color:var(--ok)}
  .pill.done,.pill.paid{background:#e7f7ee;color:var(--ok)}
  .pill.cancelled,.pill.declined,.pill.failed{background:#fdeceb;color:var(--bad)}
  .pill.open{background:#FFF6C2;color:#5a4a00}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button.act{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer}
  button.act:hover{border-color:#c3cedb}
  button.act.primary{background:var(--accent);color:var(--accent-ink);border-color:#E6BF00;font-weight:800}
  button.act.primary:hover{background:var(--accent-2)}
  button.act.danger{color:var(--bad);border-color:#f3c7c3}
  input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
  textarea{min-height:90px;width:100%;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px}
  .kv .k{color:var(--mut)}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,96vw);background:#fff;box-shadow:-12px 0 40px rgba(13,17,23,.16);padding:20px 22px;overflow:auto;transform:translateX(105%);transition:.22s;z-index:30}
  .drawer.open{transform:none}
  .drawer h3{margin:0 0 2px;font-size:19px}
  .drawer .close{position:absolute;top:14px;right:16px;border:0;background:#f1f4f8;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}
  .tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  .tabs button.on{background:var(--ink);color:var(--accent);border-color:var(--ink)}
  .mail{background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px}
  .mail .s{font-weight:600}
  .err{color:var(--bad);font-size:13px}
  .ok{color:var(--ok);font-size:13px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
  .cal-head{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:center;padding:4px 0}
  .cal-cell{min-height:86px;border-radius:9px;background:#fbfcfe;border:1px solid #eef1f5;padding:6px}
  .cal-cell.empty{background:transparent;border:0}
  .cal-cell.closed{background:#f4f6f9;border-style:dashed}
  .cal-d{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px}
  .cal-job{font-size:11.5px;border-radius:7px;padding:4px 6px;margin-bottom:4px;cursor:pointer;background:#FFF6C2;color:#5a4a00;line-height:1.3}
  .cal-job b{font-weight:700}
  .cal-job.confirmed,.cal-job.deposit_paid,.cal-job.done{background:#e7f7ee;color:#0a5c33}
  .cal-job.quoted,.cal-job.lead{background:#fff4e5;color:#8a4a00}
  .cal-job.cancelled{background:#fdeceb;color:#8f1d15;text-decoration:line-through}
  @media(max-width:820px){.cal{grid-template-columns:repeat(7,minmax(0,1fr));font-size:11px}.cal-cell{min-height:64px;padding:3px}}
  .login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
  @media(max-width:820px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;gap:6px;overflow-x:auto;padding:10px}nav .brand,nav .who{display:none}nav button{width:auto;white-space:nowrap}.grid2{grid-template-columns:1fr}main{padding:16px 12px 50px}}
</style>
</head>
<body>

<div id="login" class="login">
  <h1 style="font-size:20px">Bimmer House Calls</h1>
  <div class="muted" style="margin-bottom:14px">Owner dashboard — enter your admin key.</div>
  <input id="keyInput" type="password" placeholder="Admin key" style="width:100%;margin-bottom:10px">
  <button class="act primary" id="keyBtn" style="width:100%;padding:11px">Open dashboard</button>
  <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px"><input type="checkbox" id="remember" checked style="width:16px;height:16px"> Keep me signed in on this device</label>
  <div class="muted" style="margin-top:10px;font-size:12.5px">Lost the key? On the computer running the site: <code>./bhc.sh password</code> prints it, <code>./bhc.sh password NEWONE</code> changes it.</div>
</div>

<div class="app" id="app" hidden>
  <nav>
    <div class="brand" style="padding:0 0 14px"><img src="/brand/logo.svg" alt="Bimmer House Calls" style="width:100%;max-width:190px;display:block"></div>
    <button data-view="overview" class="on">Overview</button>
    <button data-view="calendar">Calendar</button>
    <button data-view="bookings">Bookings</button>
    <button data-view="invoices">Invoices</button>
    <button data-view="emails">Emails</button>
    <button data-view="settings">Settings</button>
    <div class="who" id="who">owner</div>
  </nav>
  <main id="main"></main>
</div>

<div class="drawer" id="drawer"><button class="close" id="drawerClose">✕</button><div id="drawerBody"></div></div>

<script>
const API = location.origin.startsWith('http') ? location.origin : '';
const money = n => '$' + Number(n || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const when = s => s ? new Date(s).toLocaleString('en-US', {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}) : '—';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
let KEY = localStorage.getItem('bhc_admin_key') || sessionStorage.getItem('bhc_admin_key') || '';
let VIEW = 'overview';
const $ = id => document.getElementById(id);

async function api(path, body) {
  const r = await fetch(API + '/api/admin/' + path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: {'Content-Type': 'application/json', 'X-Admin-Key': KEY},
    body: body === undefined ? undefined : JSON.stringify(body || {})
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}

/* ---------- views ---------- */
async function overview() {
  const [s, b] = await Promise.all([api('summary'), api('bookings', {status: 'all', limit: 8})]);
  const k = s.bookingsByStatus || {};
  const upcoming = (s.upcoming || []);
  $('main').innerHTML = `
    <h1>Overview</h1>
    <div class="muted">Everything from the shop: money in, money owed, what's next on the calendar.</div>
    <div class="cards">
      <div class="kpi"><div class="k">Collected</div><div class="v">${money(s.collected)}</div></div>
      <div class="kpi"><div class="k">Outstanding</div><div class="v">${money(s.outstanding)}</div></div>
      <div class="kpi"><div class="k">Confirmed jobs</div><div class="v">${(k.confirmed || 0) + (k.deposit_paid || 0)}</div></div>
      <div class="kpi"><div class="k">Open quotes</div><div class="v">${(k.quoted || 0) + (k.proposal_sent || 0) + (k.signed || 0)}</div></div>
    </div>
    <div class="grid2">
      <div class="card"><h2>Next up</h2>${upcoming.length ? `<table><tr><th>When</th><th>Client</th><th>Car</th><th></th></tr>
        ${upcoming.map(u => `<tr class="click" data-b="${u.code}"><td>${when(u.scheduled_start)}</td><td>${esc(u.name)}</td><td>${esc(u.model || '')}</td><td><span class="pill ${u.status}">${u.status.replace('_',' ')}</span></td></tr>`).join('')}</table>` : '<div class="muted">Nothing booked yet.</div>'}</div>
      <div class="card"><h2>Email queue (next to send)</h2>${(s.emailQueue || []).length ? s.emailQueue.map(e => `<div class="mail"><div class="s">${esc(e.subject)}</div><div class="muted">${when(e.scheduled_for)}</div></div>`).join('') : '<div class="muted">Queue is empty — every email has gone out.</div>'}</div>
    </div>
    <div class="card"><h2>Latest requests</h2>${bookingsTable(b.bookings)}</div>`;
  wireBookings();
}

function bookingsTable(list) {
  if (!list.length) return '<div class="muted">No bookings yet. Requests from the website land here.</div>';
  return `<table><tr><th>Code</th><th>Client</th><th>Car</th><th>Scheduled</th><th>Total</th><th>Paid</th><th>Status</th></tr>
    ${list.map(b => `<tr class="click" data-id="${b.id}">
      <td><b>${esc(b.code)}</b><div class="muted">${esc(b.proposal || '')}</div></td>
      <td>${esc(b.client)}<div class="muted">${esc(b.email || '')}</div></td>
      <td>${esc(b.model || '')}<div class="muted">${esc(b.vin || '')}</div></td>
      <td>${when(b.scheduled_start)}</td>
      <td>${money(b.total)}</td>
      <td>${money(b.paid)}</td>
      <td><span class="pill ${b.status}">${b.status.replace('_', ' ')}</span></td></tr>`).join('')}</table>`;
}
function wireBookings() {
  document.querySelectorAll('[data-id]').forEach(r => r.onclick = () => openBooking(Number(r.dataset.id)));
}

async function calendarView(monthOffset) {
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + (monthOffset || 0));
  const y = base.getFullYear(), m = base.getMonth();
  const first = new Date(y, m, 1);
  const days = new Date(y, m + 1, 0).getDate();
  const startPad = first.getDay();
  const list = (await api('bookings', {status: 'all', limit: 500})).bookings;
  const byDay = {};
  list.forEach(b => { if (b.scheduled_start) { const d = b.scheduled_start.slice(0, 10); (byDay[d] = byDay[d] || []).push(b); } });
  const hours = (window.SHOP || {}).hours || {};
  const cells = [];
  for (let i = 0; i < startPad; i++) cells.push('<div class="cal-cell empty"></div>');
  for (let d = 1; d <= days; d++) {
    const iso = new Date(y, m, d).toISOString().slice(0, 10);
    const dow = new Date(y, m, d).getDay();
    const closed = !(hours[String(dow)] || []).length;
    const jobs = byDay[iso] || [];
    cells.push(`<div class="cal-cell${closed ? ' closed' : ''}"><div class="cal-d">${d}${closed ? ' <span class="muted" style="font-size:10px">closed</span>' : ''}</div>
      ${jobs.map(j => `<div class="cal-job ${j.status}" data-id="${j.id}" title="${esc(j.client)} · ${esc(j.code)}">
        <b>${(j.scheduled_start || '').slice(11, 16)}</b> ${esc(j.client.split(' ')[0])}<div style="font-size:11px;opacity:.8">${esc(j.model || '')}</div></div>`).join('')}
    </div>`);
  }
  const monthName = first.toLocaleString('en-US', {month: 'long', year: 'numeric'});
  $('main').innerHTML = `<h1>Calendar</h1>
    <div class="row" style="margin:12px 0">
      <button class="act" id="prevM">←</button><b style="min-width:170px;text-align:center">${monthName}</b>
      <button class="act" id="nextM">→</button><span class="muted">${esc((window.SHOP || {}).hoursLabel || '')}</span>
    </div>
    <div class="cal">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="cal-head">${d}</div>`).join('')}${cells.join('')}</div>
    <div class="card" style="margin-top:14px"><h2>Upcoming jobs</h2>
      ${list.filter(b => b.scheduled_start && b.scheduled_start >= new Date().toISOString().slice(0, 10)).sort((a, b) => a.scheduled_start < b.scheduled_start ? -1 : 1).slice(0, 12)
        .map(b => `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0">
          <div><b>${when(b.scheduled_start)}</b> · ${esc(b.client)} · ${esc(b.model || '')}</div>
          <span class="pill ${b.status}">${b.status.replace('_', ' ')}</span></div>`).join('') || '<div class="muted">Nothing booked.</div>'}
    </div>`;
  $('prevM').onclick = () => calendarView((monthOffset || 0) - 1);
  $('nextM').onclick = () => calendarView((monthOffset || 0) + 1);
  document.querySelectorAll('.cal-job').forEach(j => j.onclick = () => openBooking(Number(j.dataset.id)));
}

async function bookingsView() {
  const filter = localStorage.getItem('bhc_filter') || 'all';
  const b = await api('bookings', {status: filter, limit: 200});
  const opts = ['all', 'quoted', 'signed', 'confirmed', 'deposit_paid', 'done', 'cancelled'];
  $('main').innerHTML = `<h1>Bookings</h1>
    <div class="row" style="margin:12px 0">${opts.map(o => `<button class="act ${o === filter ? 'primary' : ''}" data-f="${o}">${o.replace('_', ' ')}</button>`).join('')}</div>
    <div class="card">${bookingsTable(b.bookings)}</div>`;
  document.querySelectorAll('[data-f]').forEach(x => x.onclick = () => { localStorage.setItem('bhc_filter', x.dataset.f); bookingsView(); });
  wireBookings();
}

async function invoicesView() {
  const b = await api('bookings', {status: 'all', limit: 200});
  const rows = b.bookings.filter(x => x.total > 0);
  $('main').innerHTML = `<h1>Invoices</h1>
    <div class="muted">Every job with money on it. Open a booking to send an invoice or record a payment.</div>
    <div class="card" style="margin-top:14px">${rows.length ? `<table><tr><th>Booking</th><th>Client</th><th>Total</th><th>Paid</th><th>Balance</th><th></th></tr>
      ${rows.map(r => `<tr class="click" data-id="${r.id}"><td><b>${esc(r.code)}</b></td><td>${esc(r.client)}</td>
        <td>${money(r.total)}</td><td>${money(r.paid)}</td>
        <td><b style="color:${r.balanceDue > 0 ? '#b25e00' : '#0a7d43'}">${money(r.balanceDue)}</b></td>
        <td><button class="act" data-inv="${r.id}">Send invoice</button></td></tr>`).join('')}</table>` : '<div class="muted">No invoices yet.</div>'}</div>`;
  document.querySelectorAll('[data-id]').forEach(r => r.onclick = e => { if (!e.target.dataset.inv) openBooking(Number(r.dataset.id)); });
  document.querySelectorAll('[data-inv]').forEach(btn => btn.onclick = async e => {
    e.stopPropagation();
    const d = await api('booking', {bookingId: Number(btn.dataset.inv)});
    openBooking(Number(btn.dataset.inv), 'invoice');
  });
}

async function emailsView() {
  $('main').innerHTML = `<h1>Emails</h1>
    <div class="muted">Automated emails go out on their own: quote sent, reminder at 48h, signed confirmation, day-before reminder at 5pm, receipt, and a review ask the day after the job.</div>
    <div class="card" style="margin-top:14px"><h2>Templates</h2>
    <table><tr><th>When it sends</th><th>Template</th></tr>
    ${[['Right away', 'proposal_sent — quote + link to sign'],
       ['48h later (cancelled if they sign)', 'proposal_reminder'],
       ['On signing — standard job', 'booking_confirmed'],
       ['On signing — custom order', 'proposal_signed + deposit invoice'],
       ['Day before at 5pm', 'day_before'],
       ['Day after the job at 8pm', 'review_request'],
       ['When you invoice', 'invoice_manual / invoice_sent'],
       ['When you record a payment', 'payment_receipt'],
       ['When you reschedule / cancel', 'reschedule / cancellation'],
       ['14 days after an unsigned quote', 'follow_up_lead']].map(t => `<tr><td>${t[0]}</td><td><code>${t[1]}</code></td></tr>`).join('')}
    </table></div>
    <div class="card"><h2>Send a one-off email</h2>
      <div class="muted" style="margin-bottom:10px">Pick a booking, write it, and it goes out with the next worker run.</div>
      <div class="row"><input id="mB" placeholder="Booking code (BHC-2026-1234)" style="flex:1"><input id="mS" placeholder="Subject" style="flex:1"></div>
      <textarea id="mBody" placeholder="Message" style="margin-top:10px"></textarea>
      <div class="row" style="margin-top:10px"><button class="act primary" id="mSend">Queue email</button><span id="mMsg" class="muted"></span></div>
    </div>`;
  $('mSend').onclick = async () => {
    const list = await api('bookings', {status: 'all', limit: 200});
    const b = list.bookings.find(x => x.code.toLowerCase() === $('mB').value.trim().toLowerCase());
    if (!b) { $('mMsg').textContent = 'No booking with that code.'; return; }
    await api('email.send', {bookingId: b.id, subject: $('mS').value, body: $('mBody').value});
    $('mMsg').textContent = 'Queued — sends on the next worker run.';
  };
}

async function settingsView() {
  const c = await (await fetch(API + '/api/catalog')).json();
  const t = c.travel, s = c.shop;
  $('main').innerHTML = `<h1>Settings</h1>
    <div class="muted">Read from <code>data/services.json</code> — edit that file and restart the API to change prices, travel tiers or hours.</div>
    <div class="grid2" style="margin-top:14px">
      <div class="card"><h2>Invoices</h2>
        <div class="muted" style="margin-bottom:10px">Invoices start from the client's estimate, then <b>you</b> set the final numbers — change quantities, prices, add or remove lines, add a note, then email it. Nothing goes out until you send it. Once a payment is recorded an invoice is locked (issue a new one for a change).</div>
        <div id="invoiceList"></div>
      </div>
      <div class="card"><h2>Your records</h2>
        <div class="muted" style="margin-bottom:10px">Every finished job is also written to a folder on disk — <code>work/YYYY-MM/JOB_Client/</code> — with the job sheet, invoices, the signature record (name, time, IP, terms version, document hash) and every email we sent. Nothing lives only in this dashboard.</div>
        <div class="row"><button class="act primary" id="archiveBtn">File finished jobs now</button><span id="archiveOut" class="muted"></span></div>
        <div class="row" style="margin-top:10px"><button class="act" id="dbBtn">Download the database</button><span class="muted">Save this before any redeploy on a host without a disk.</span></div>
        <div class="row" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
          <button class="act" id="testEmailBtn">Send a test email to myself</button>
          <span id="testEmailOut" class="muted">Checks that client email really sends. Run this after adding the Gmail app password.</span>
        </div>
        <div class="row" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
          <button class="act" id="resetBtn" style="border-color:#b42318;color:#b42318">Start clean — delete all test data</button>
          <span id="resetOut" class="muted">Removes every client, booking, quote, invoice and email. Keeps your menu, terms, colors and password.</span>
        </div>
        <div class="muted" style="margin-top:8px;font-size:12.5px">Backups: <code>./bhc.sh backup</code> writes a dated zip of the whole database to <code>backups/</code>.</div>
      </div>
      <div class="card"><h2>Shop</h2><div class="kv">
        <div class="k">Base</div><div>${esc(s.baseAddress)}</div>
        <div class="k">Hours</div><div>${esc(s.hoursLabel || '')}</div>
        <div class="k">Phone</div><div>${esc(s.phone)}</div>
        <div class="k">Email</div><div>${esc(s.email)}</div>
        <div class="k">Deposit</div><div>Custom orders only, ${s.depositPercentCustom || 25}%</div>
        <div class="k">NJ tax on parts</div><div>${(s.taxRateNJ * 100).toFixed(3)}%</div>
      </div></div>
      <div class="card"><h2>Travel</h2><div class="kv">
        ${(t.tiers || []).map(x => `<div class="k">${x.upToMiles ? '0–' + x.upToMiles + ' mi' : (t.tiers[t.tiers.length - 2] ? t.tiers[t.tiers.length - 2].upToMiles + '+ mi' : '')}</div><div>${x.perMile ? '$' + x.perMile.toFixed(2) + ' / mile' : 'Free'}</div>`).join('')}
        <div class="k">Range</div><div>up to ${t.maxDriveMiles} miles</div>
        <div class="k">Billed</div><div>${t.roundTrip ? 'round trip' : 'one way (to the job)'}</div>
        <div class="k">Drive time</div><div>${t.avgMph} mph average</div>
        ${t.afterHoursSurcharge ? `<div class="k">After hours</div><div>+$${t.afterHoursSurcharge} before 8am / after 6pm</div>` : ''}
      </div></div>
    </div>
    <div class="card"><h2>Services (${c.categories.reduce((n, x) => n + x.items.length, 0)})</h2>
      ${c.categories.map(cat => `<div style="margin-bottom:12px"><b>${esc(cat.name)}</b>
        <div class="muted" style="font-size:13px">${cat.items.map(i => esc(i.name) + ' — ' + (i.quote ? 'by VIN' : money(i.min) + (i.max !== i.min ? '–' + money(i.max) : ''))).join(' · ')}</div></div>`).join('')}
    </div>`;
  invoiceEditor();
}

async function invoiceEditor() {
  const box = $('invoiceList');
  if (!box) return;
  const d = await api('invoices', {});
  const list = d.invoices || (Array.isArray(d) ? d : []);
  if (!list.length) { box.innerHTML = '<div class="muted">No invoices yet — they appear here once a job is booked.</div>'; return; }
  box.innerHTML = list.slice(0, 40).map(i => `
    <div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0;gap:10px">
      <div><b>${esc(i.number)}</b> · ${esc(i.client || '')}<div class="muted" style="font-size:12.5px">${esc(i.kind || '')} · due ${esc((i.due_at || '').slice(0, 10))}${i.draft ? ' · <b style="color:#b39100">draft — not sent yet</b>' : ''}</div></div>
      <div class="row" style="gap:8px;align-items:center">
        <b>${money(i.amountDue || 0)}</b><span class="pill ${i.status}">${i.draft ? 'draft' : i.status}</span>
        <button class="act" data-edit="${i.id}">${i.draft ? 'Edit price' : 'Edit'}</button>
        <button class="act primary" data-send="${i.id}">${i.draft ? 'Send invoice' : 'Email again'}</button>
      </div>
    </div>`).join('');
  box.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openInvoiceEditor(Number(b.dataset.edit), list));
  box.querySelectorAll('[data-send]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = 'Sending…';
    try {
      const r = await api('invoice.send', {invoiceId: Number(b.dataset.send)});
      b.textContent = 'Sent';
      toast(`Emailed ${r.number} to ${r.to}`);
      invoiceEditor();
    } catch (e) { b.disabled = false; b.textContent = 'Send invoice'; toast('Could not send: ' + e.message); }
  });
}

async function openInvoiceEditor(id, list) {
  const inv = list.find(x => x.id === id);
  if (!inv) return;
  const lines = (inv.lines || []).map(l => ({name: l.name, qty: l.qty || 1, unit: l.unit || l.total || 0, kind: l.kind || 'service'}));
  if (!lines.length) lines.push({name: 'Service', qty: 1, unit: inv.amountDue || 0, kind: 'service'});
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(11,11,13,.55);z-index:50;overflow:auto;padding:16px';
  wrap.innerHTML = `<div class="card" style="max-width:720px;margin:4vh auto">
    <h2>Edit ${esc(inv.number)}</h2>
    <div class="muted" style="margin-bottom:10px">Change anything before it goes to the client. The client's estimate is only a starting point.</div>
    <div id="linesBox"></div>
    <div class="row" style="gap:8px;margin:8px 0">
      <button class="act" id="addLine">+ Add line</button>
      <span class="muted">Subtotal <b id="sub">$0</b> · tax ${((inv.taxRate || 0) * 100).toFixed(3)}% <b id="tax">$0</b> · total <b id="tot">$0</b></span>
    </div>
    <label>Note to the client (optional)</label>
    <input id="invNote" value="${esc(inv.note || '')}" placeholder="Parts came in higher, added a second hour of labor…">
    <div class="row" style="gap:8px;margin-top:12px">
      <button class="act primary" id="saveInv">Save</button>
      <button class="act" id="saveSend">Save &amp; email it</button>
      <button class="act" id="closeInv">Cancel</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  const rows = () => lines.map((l, i) => `<div class="row" style="gap:6px;margin-bottom:6px">
      <input value="${esc(l.name)}" data-n="${i}" style="flex:2" placeholder="Description">
      <input value="${l.qty}" data-q="${i}" type="number" step="0.5" min="0" style="width:70px">
      <input value="${l.unit}" data-u="${i}" type="number" step="0.01" min="0" style="width:100px">
      <b style="width:90px;text-align:right">${money(l.qty * l.unit)}</b>
      <button class="act" data-del="${i}">x</button></div>`).join('');
  const recalc = () => {
    const sub = lines.reduce((n, l) => n + l.qty * l.unit, 0);
    const tax = sub * (inv.taxRate || 0);
    $('sub').textContent = money(sub); $('tax').textContent = money(tax); $('tot').textContent = money(sub + tax);
  };
  const redraw = () => {
    $('linesBox').innerHTML = rows();
    $('linesBox').querySelectorAll('[data-n]').forEach(el => el.oninput = () => { lines[+el.dataset.n].name = el.value; });
    $('linesBox').querySelectorAll('[data-q]').forEach(el => el.oninput = () => { lines[+el.dataset.q].qty = +el.value || 0; recalc(); });
    $('linesBox').querySelectorAll('[data-u]').forEach(el => el.oninput = () => { lines[+el.dataset.u].unit = +el.value || 0; recalc(); });
    $('linesBox').querySelectorAll('[data-del]').forEach(el => el.onclick = () => { lines.splice(+el.dataset.del, 1); redraw(); });
    recalc();
  };
  $('addLine').onclick = () => { lines.push({name: '', qty: 1, unit: 0, kind: 'service'}); redraw(); };
  $('closeInv').onclick = () => wrap.remove();
  const save = async (thenSend) => {
    try {
      const r = await api('invoice.update', {invoiceId: id, lines, note: $('invNote').value, taxRate: inv.taxRate, send: !!thenSend});
      wrap.remove();
      toast(thenSend ? `Saved and sent — ${money(r.total)}` : `Saved — total ${money(r.total)}. Not sent yet.`);
      settingsView();
    } catch (e) { toast('Could not save: ' + e.message); }
  };
  $('saveInv').onclick = () => save(false);
  $('saveSend').onclick = () => save(true);
  redraw();
}

function toast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0B0B0D;color:#FFD400;padding:11px 18px;border-radius:10px;font-size:14px;z-index:99';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

/* ---------- booking drawer ---------- */
async function openBooking(id, tab) {
  const d = await api('booking', {bookingId: id});
  const b = d.booking, c = d.client, v = d.vehicle, tot = (d.proposals[0] || {}).totals || {};
  const paid = (d.payments || []).reduce((n, p) => n + p.amount, 0);
  const bal = Math.max(0, (tot.total || 0) - paid);
  const ans = d.answers || {};
  const qs = Object.keys(ans).filter(k => ans[k]);
  $('drawerBody').innerHTML = `
    <h3>${esc(c.name)} <span class="pill ${b.status}">${b.status.replace('_', ' ')}</span></h3>
    <div class="muted">${esc(b.code)} · ${esc(c.email || '')} · ${esc(c.phone || '')}</div>
    <div class="tabs">${['details', 'money', 'emails', 'invoice'].map(t => `<button data-t="${t}" class="${(tab || 'details') === t ? 'on' : ''}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div>
    <div id="dtab"></div>`;
  const render = t => {
    document.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x.dataset.t === t));
    if (t === 'details') $('dtab').innerHTML = `
      <div class="kv">
        <div class="k">Scheduled</div><div>${when(b.scheduled_start)}</div>
        <div class="k">Car</div><div>${esc(v.model || '')} · ${esc(v.vin || '')}</div>
        <div class="k">Address</div><div>${esc([c.address, c.city, c.state, c.zip].filter(Boolean).join(', '))}</div>
        <div class="k">Travel</div><div>${b.travel_miles || 0} mi each way · ${money(b.travel_fee)}</div>
        <div class="k">Job hours</div><div>${b.job_hours || '—'}</div>
        <div class="k">Custom order</div><div>${d.custom ? 'Yes — deposit required' : 'No — pay on completion'}</div>
      </div>
      ${qs.length ? `<h2 style="margin-top:16px">Their answers</h2><div class="kv">${qs.map(k => `<div class="k">${esc(k)}</div><div>${esc(ans[k])}</div>`).join('')}</div>` : ''}
      <h2 style="margin-top:16px">Lines</h2>
      <table>${((d.proposals[0] || {}).lines || []).map(l => `<tr><td>${esc(l.name)}</td><td style="text-align:right">${l.needsQuote && !l.unit ? 'by VIN' : money(l.unit)}</td></tr>`).join('')}
        <tr><td><b>Total</b></td><td style="text-align:right"><b>${money(tot.total)}</b></td></tr></table>
      <div class="row" style="margin-top:14px">
        <button class="act" id="resend">Resend quote email</button>
        <button class="act" id="resched">Reschedule</button>
        <button class="act danger" id="cancel">Cancel</button>
      </div>
      <div id="dmsg" class="muted" style="margin-top:8px"></div>`;
    if (t === 'money') $('dtab').innerHTML = `
      <div class="cards" style="grid-template-columns:repeat(3,1fr)">
        <div class="kpi"><div class="k">Total</div><div class="v">${money(tot.total)}</div></div>
        <div class="kpi"><div class="k">Paid</div><div class="v">${money(paid)}</div></div>
        <div class="kpi"><div class="k">Balance</div><div class="v">${money(bal)}</div></div>
      </div>
      <h2>Invoices</h2>
      ${(d.invoices || []).length ? `<table><tr><th>#</th><th>Kind</th><th>Amount</th><th>Status</th><th></th></tr>
        ${d.invoices.map(i => `<tr><td>${esc(i.number)}</td><td>${esc(i.totals.kind || '')}</td><td>${money(i.totals.amountDue)}</td>
          <td><span class="pill ${i.status}">${i.status}</span></td>
          <td><a href="/i/${i.public_token}" target="_blank">view</a> · <button class="act" data-email="${i.id}">email</button></td></tr>`).join('')}</table>`
        : '<div class="muted">No invoices yet.</div>'}
      <h2 style="margin-top:16px">Record a payment</h2>
      <div class="row">
        <select id="pInv">${(d.invoices || []).map(i => `<option value="${i.id}">${esc(i.number)} · ${money(i.totals.amountDue)}</option>`).join('')}</select>
        <input id="pAmt" type="number" step="0.01" placeholder="Amount" style="width:120px">
        <select id="pMethod"><option>card</option><option>cash</option><option>zelle</option><option>check</option></select>
        <button class="act primary" id="pBtn">Record</button>
      </div>
      <div id="pMsg" class="muted" style="margin-top:8px"></div>
      <h2 style="margin-top:16px">Payment history</h2>
      ${(d.payments || []).length ? `<table><tr><th>Date</th><th>Amount</th><th>Method</th></tr>${d.payments.map(p => `<tr><td>${when(p.received_at)}</td><td>${money(p.amount)}</td><td>${esc(p.method)}</td></tr>`).join('')}</table>` : '<div class="muted">No payments yet.</div>'}`;
    if (t === 'invoice') $('dtab').innerHTML = `
      <h2>Send an invoice</h2>
      <div class="muted" style="margin-bottom:10px">Balance on this job: <b>${money(bal)}</b>. Amount can be anything — a change order, parts, a trip charge.</div>
      <div class="row"><input id="iAmt" type="number" step="0.01" value="${bal || ''}" placeholder="Amount" style="width:140px">
        <input id="iDesc" placeholder="What it's for (shows on the invoice)" style="flex:1"></div>
      <div class="row" style="margin-top:10px"><button class="act primary" id="iBtn">Create &amp; email invoice</button><span id="iMsg" class="muted"></span></div>`;
    if (t === 'emails') $('dtab').innerHTML = `
      <h2>Email history</h2>
      ${(d.emails || []).length ? d.emails.map(e => `<div class="mail"><div class="s">${esc(e.subject)}</div>
        <div class="muted">${esc(e.template)} · <span class="pill ${e.status}">${e.status}</span> · ${e.status === 'queued' ? 'sends ' + when(e.scheduled_for) : when(e.sent_at || e.scheduled_for)}</div>
        ${e.error ? `<div class="err">${esc(e.error)}</div>` : ''}
        ${e.status === 'failed' ? `<button class="act" data-retry="${e.id}" style="margin-top:6px">Retry</button>` : ''}</div>`).join('') : '<div class="muted">No emails yet.</div>'}
      <h2 style="margin-top:16px">Send something yourself</h2>
      <input id="oS" placeholder="Subject" style="width:100%;margin-bottom:8px">
      <textarea id="oB" placeholder="Message"></textarea>
      <div class="row" style="margin-top:10px"><button class="act primary" id="oSend">Queue email</button><span id="oMsg" class="muted"></span></div>`;
    wire(d, t);
  };
  render(tab || 'details');
  document.querySelectorAll('[data-t]').forEach(x => x.onclick = () => render(x.dataset.t));
  $('drawer').classList.add('open');
}

function wire(d, t) {
  const id = d.booking.id, msg = $('dmsg') || $('pMsg') || $('iMsg') || $('oMsg');
  if ($('resend')) $('resend').onclick = async () => {
    const p = d.proposals[0];
    await api('proposal.resend', {proposalId: p.id});
    $('dmsg').textContent = 'Quote email queued.';
  };
  if ($('resched')) $('resched').onclick = async () => {
    const v = prompt('New date & time (YYYY-MM-DDTHH:MM)', d.booking.scheduled_start || '');
    if (!v) return;
    await api('reschedule', {bookingId: id, scheduledStart: v});
    $('dmsg').textContent = 'Moved. Client emailed.';
  };
  if ($('cancel')) $('cancel').onclick = async () => {
    if (!confirm('Cancel this booking? The client gets an email.')) return;
    await api('cancel', {bookingId: id});
    $('dmsg').textContent = 'Cancelled.';
  };
  if ($('pBtn')) $('pBtn').onclick = async () => {
    const inv = $('pInv').value, amt = Number($('pAmt').value);
    if (!inv || !amt) { $('pMsg').textContent = 'Pick an invoice and an amount.'; return; }
    await api('payment.record', {invoiceId: Number(inv), amount: amt, method: $('pMethod').value});
    $('pMsg').textContent = 'Payment recorded.';
    openBooking(id, 'money');
  };
  if ($('iBtn')) $('iBtn').onclick = async () => {
    const amt = Number($('iAmt').value);
    if (!amt) { $('iMsg').textContent = 'Enter an amount.'; return; }
    const inv = await api('invoice.create', {bookingId: id, amount: amt, description: $('iDesc').value});
    await api('invoice.email', {invoiceId: inv.invoiceId});
    $('iMsg').textContent = 'Invoice ' + inv.number + ' created and emailed.';
  };
  if ($('oSend')) $('oSend').onclick = async () => {
    await api('email.send', {bookingId: id, subject: $('oS').value, body: $('oB').value});
    $('oMsg').textContent = 'Queued.';
  };
  document.querySelectorAll('[data-email]').forEach(btn => btn.onclick = async () => {
    await api('invoice.email', {invoiceId: Number(btn.dataset.email)});
    btn.textContent = 'queued ✓';
  });
  document.querySelectorAll('[data-retry]').forEach(btn => btn.onclick = async () => {
    await api('email.retry', {id: Number(btn.dataset.retry)});
    openBooking(id, 'emails');
  });
}

/* ---------- boot ---------- */
$('drawerClose').onclick = () => $('drawer').classList.remove('open');
document.querySelectorAll('nav [data-view]').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('nav [data-view]').forEach(b => b.classList.toggle('on', b === btn));
  VIEW = btn.dataset.view;
  ({overview, calendar: () => calendarView(0), bookings: bookingsView, invoices: invoicesView, emails: emailsView, settings: settingsView})[VIEW]();
});

async function applyTheme() {
  try {
    const c = await (await fetch(API + '/api/catalog')).json();
    const t = c.theme || {};
    const root = document.documentElement.style;
    const map = {ink: '--ink', muted: '--mut', line: '--line', accent: '--accent', ok: '--ok', warn: '--warn',
                 bad: '--bad', bg: '--bg', navBg: '--nav-bg', navInk: '--nav-ink', navOn: '--nav-on'};
    Object.entries(map).forEach(([k, v]) => { if (t[k]) root.setProperty(v, t[k]); });
    window.SHOP = c.shop || {};
  } catch (e) {}
}

async function enter() {
  try {
    await applyTheme();
    await api('summary');
    $('login').hidden = true; $('app').hidden = false;
    $('who').textContent = 'Signed in as owner';
    ({overview, calendar: () => calendarView(0), bookings: bookingsView, invoices: invoicesView, emails: emailsView, settings: settingsView})[VIEW]();
  } catch (e) {
    $('login').hidden = false; $('app').hidden = true;
    $('login').querySelector('.muted').textContent = 'Admin key rejected — try again.';
  }
}
$('keyBtn').onclick = () => {
  KEY = $('keyInput').value.trim();
  if ($('remember').checked) localStorage.setItem('bhc_admin_key', KEY);
  else sessionStorage.setItem('bhc_admin_key', KEY);
  enter();
};
document.addEventListener('DOMContentLoaded', () => {
  const tb = $('testEmailBtn');
  if (tb) tb.onclick = async () => {
    const out = $('testEmailOut');
    tb.disabled = true; tb.textContent = 'Sending…';
    try {
      const r = await api('email.send_test', {});
      out.textContent = r.sent
        ? 'Sent to ' + r.to + ' via ' + r.how + '. Check that inbox (and spam).'
        : 'Not sent. ' + (r.why || 'No sender configured.');
    } catch (e) { out.textContent = 'Not sent. ' + e.message; }
    tb.disabled = false; tb.textContent = 'Send a test email to myself';
  };
  const rb = $('resetBtn');
  if (rb) rb.onclick = async () => {
    const out = $('resetOut');
    if (!confirm('Delete every test client, booking, quote, invoice and email? Your menu, terms, colors and password stay. Download the database first if you are not sure.')) return;
    rb.disabled = true; rb.textContent = 'Clearing…';
    try {
      const r = await api('database.reset', {confirm: 'RESET'});
      const c = r.cleared || {};
      out.textContent = 'Cleared: ' + Object.entries(c).filter(([, v]) => v).map(([k, v]) => v + ' ' + k).join(', ') + '. Ready for the first real customer.';
    } catch (e) { out.textContent = e.message; }
    rb.disabled = false; rb.textContent = 'Start clean — delete all test data';
  };
  const db = $('dbBtn');
  if (db) db.onclick = () => {
    fetch(API + '/admin/database.sqlite3', {headers: {'X-Admin-Key': KEY}})
      .then(r => r.ok ? r.blob() : Promise.reject(new Error('Not authorized')))
      .then(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'bhc-' + new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-') + '.sqlite3';
        a.click();
      })
      .catch(e => alert('Could not download: ' + e.message));
  };
  const b = $('archiveBtn');
  if (b) b.onclick = async () => {
    b.disabled = true; b.textContent = 'Filing…';
    try {
      const r = await api('archive.run', {});
      $('archiveOut').textContent = `Filed ${r.filed} job(s), ${r.already} already on disk.`;
    } catch (e) { $('archiveOut').textContent = 'Could not file: ' + e.message; }
    b.disabled = false; b.textContent = 'File finished jobs now';
  };
});
$('keyInput').onkeydown = e => { if (e.key === 'Enter') $('keyBtn').click(); };
if (KEY) { $('keyInput').value = KEY; enter(); } else { $('keyInput').focus(); }
</script>
